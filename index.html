<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KickMatch</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050805;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: #050805;
    }

    header {
      padding: 28px 20px 15px;
      background: linear-gradient(180deg, #0b180d, #050805);
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .green {
      color: #72e62e;
    }

    .xp {
      margin-top: 12px;
      color: #aaa;
      font-size: 13px;
    }

    .bar {
      height: 7px;
      background: #222;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: 54%;
      height: 100%;
      background: #72e62e;
    }

    main {
      padding: 20px;
    }

    .card {
      background: #101510;
      border: 1px solid #293029;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    h2 {
      font-size: 19px;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    .match {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #292929;
    }

    .match:last-child {
      border-bottom: 0;
    }

    .team {
      font-weight: 700;
    }

    .vs {
      color: #72e62e;
      font-weight: 900;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #72e62e;
      color: #061006;
      font-size: 16px;
      font-weight: 800;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="lockScreen">
  <h2>🔒 KickMatch</h2>
  <p>Bitte Zugangscode eingeben</p>

  <input type="password" id="accessCode" placeholder="Zugangscode">

  <button onclick="checkCode()">Entsperren</button>

  <p id="error"></p>
</div>

  <div class="app">

    <header>
      <div class="logo">
        Kick<span class="green">Match</span>
      </div>

      <div class="xp">
        XP 540 / 1000
      </div>

      <div class="bar">
        <span></span>
      </div>
    </header>

    <main>

      <div class="card">
        <h1>⚽ KickMatch</h1>
        <p>
          Finde dein nächstes Fußball-Match.
        </p>

        <button onclick="alert('Match-Suche gestartet!')">
          Match finden
    
           </button>
            <button onclick="showAuth()">
    Registrieren / Anmelden
        </button>
      </div>

      <div class="card">
        <h2>🔥 Nächste Matches</h2>

        <div class="match">
          <span class="team">FC Bayern</span>
          <span class="vs">VS</span>
          <span class="team">Dortmund</span>
        </div>

        <div class="match">
          <span class="team">Leipzig</span>
          <span class="vs">VS</span>
          <span class="team">Leverkusen</span>
        </div>

        <div class="match">
          <span class="team">Hamburg</span>
          <span class="vs">VS</span>
          <span class="team">Bremen</span>
        </div>
      </div>

      <div class="card">
        <h2>🏆 Dein Level</h2>
        <p>
          Du bist aktuell auf Level 5.
        </p>

        <div class="bar">
          <span style="width: 70%;"></span>
        </div>
      </div>

    </main>

    <footer>
      KickMatch © 2026
    </footer>

  
<script>
function checkCode() {
    const code = document.getElementById("accessCode").value;
    const lockScreen = document.getElementById("lockScreen");
    const app = document.querySelector(".app");

    if (code === "1234") {
        lockScreen.style.display = "none";
        app.style.display = "block";
        document.getElementById("error").textContent = "";
    } else {
        document.getElementById("error").textContent =
            "❌ Falscher Zugangscode";
    }
}function showAuth() {
  document.getElementById("authBox").style.display = "flex";
}

function closeAuth() {
  document.getElementById("authBox").style.display = "none";
}

function registerUser() {
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const message = document.getElementById("authMessage");

  if (!email || !password) {
    message.textContent = "❌ Bitte E-Mail und Passwort eingeben.";
    return;
  }

  localStorage.setItem("kickmatchUser", JSON.stringify({
    email: email,
    password: password
  }));

  message.textContent = "✅ Registrierung erfolgreich!";
}

function loginUser() {
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const message = document.getElementById("authMessage");

  const savedUser = localStorage.getItem("kickmatchUser");

  if (!savedUser) {
    message.textContent = "❌ Noch kein Konto registriert.";
    return;
  }

  const user = JSON.parse(savedUser);

  if (user.email === email && user.password === password) {
    message.textContent = "✅ Erfolgreich angemeldet!"
    closeAuth();
  } else {
    message.textContent = "❌ E-Mail oder Passwort falsch.";
  }
}

window.onload = function() {
    const lockScreen = document.getElementById("lockScreen");
    const app = document.querySelector(".app");

    lockScreen.style.display = "block";
    app.style.display = "none";
};
</script>






  </div><div id="authBox" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  z-index:9999;
  align-items:center;
  justify-content:center;
">
  <div style="
    background:#101510;
    padding:25px;
    border-radius:20px;
    width:90%;
    max-width:400px;
  ">
    <h2>👤 Registrieren / Anmelden</h2>

    <input
      id="authEmail"
      type="email"
      placeholder="E-Mail"
      style="width:100%;padding:14px;margin:8px 0;"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Passwort"
      style="width:100%;padding:14px;margin:8px 0;"
    >

    <button onclick="registerUser()">
      Registrieren
    </button>

    <button onclick="loginUser()">
      Anmelden
    </button>

    <button onclick="closeAuth()">
      Schließen
    </button>

    <p id="authMessage"></p>
  </div>
</div>

</body>
</html>
